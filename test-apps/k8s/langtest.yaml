apiVersion: v1
kind: Namespace
metadata: {name: langtest}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: lang-python, namespace: langtest}
spec:
  replicas: 1
  selector: {matchLabels: {app: lang-python}}
  template:
    metadata: {labels: {app: lang-python}}
    spec:
      containers:
      - name: app
        image: 339713148266.dkr.ecr.us-east-1.amazonaws.com/pulse0-e2e:lang-python
        imagePullPolicy: Always
        ports: [{containerPort: 8000}]
        env:
        - {name: OTEL_SERVICE_NAME, value: "lang-python"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://pulse0-collector.observability.svc.cluster.local:4319"}
        - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf"}
        - {name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment=langtest"}
        resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 768Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: lang-python, namespace: langtest}
spec:
  selector: {app: lang-python}
  ports: [{port: 8000, targetPort: 8000}]
---
