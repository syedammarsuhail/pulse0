apiVersion: apps/v1
kind: Deployment
metadata: {name: loadloop, namespace: langtest}
spec:
  replicas: 1
  selector: {matchLabels: {app: loadloop}}
  template:
    metadata: {labels: {app: loadloop}}
    spec:
      containers:
      - name: loop
        image: public.ecr.aws/docker/library/alpine:3.20
        command: ["/bin/sh","-c"]
        args:
        - |
          while true; do
            for s in lang-node lang-java lang-dotnet lang-go; do wget -q -T 5 -O /dev/null http://$s:8000/work || true; done
            sleep 0.3
          done
        resources: {requests: {cpu: 10m, memory: 16Mi}}
