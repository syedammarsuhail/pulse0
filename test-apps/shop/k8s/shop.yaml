        imagePullPolicy: Always
        ports: [{containerPort: 9000}]
        env:
        - {name: TARGET, value: "http://gateway:8000"}
        - {name: PROFILE, value: "steady"}
        - {name: RPS, value: "5"}
        - {name: DURATION, value: "0"}
