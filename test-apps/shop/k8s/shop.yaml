apiVersion: v1
kind: Namespace
metadata: {name: langtest}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: langtest, labels: {app: gateway, part-of: pulse0-shop}}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway, part-of: pulse0-shop}}
    spec:
      containers:
      - name: app
        image: 339713148266.dkr.ecr.us-east-1.amazonaws.com/pulse0-e2e:shop-gateway
        imagePullPolicy: Always
        ports: [{containerPort: 8000}]
        env:
        - {name: OTEL_SERVICE_NAME, value: "shop-gateway"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://pulse0-collector.observability.svc.cluster.local:4319"}
        - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf"}
        - {name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment=langtest,service.namespace=pulse0-shop"}
        - {name: CATALOG_URL, value: "http://catalog:8000"}
        - {name: ORDERS_URL, value: "http://orders:8000"}
        resources: {requests: {cpu: 20m, memory: 128Mi}, limits: {memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: langtest}
spec:
  selector: {app: gateway}
  ports: [{port: 8000, targetPort: 8000}]
---
