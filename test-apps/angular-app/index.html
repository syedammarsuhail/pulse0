<!doctype html>
<!-- Plain SPA representing an Angular/React app. Zero code change: all OTel
     wiring lives in a single vendored bundle (otel-rum.js) added by ops.
     No external CDN; self-hosted alongside your app. -->
<html>
<head>
<meta charset="utf-8"/>
<title>Storefront (Angular)</title>
<script>
  window.PULSE0_ENDPOINT = "http://127.0.0.1:4318/v1/traces";
  window.PULSE0_SERVICE = "angular-app";
</script>
<script src="otel-rum.js"></script>
</head>
<body style="font-family:sans-serif;max-width:720px;margin:40px auto">
<h1>Storefront (Angular-like)</h1>
<p>Click buttons to generate telemetry sent to Pulse0 — no change to the app's own code.</p>
<button onclick="fetch('http://127.0.0.1:7002/products').then(r=>r.json()).then(j=>out.textContent=JSON.stringify(j))">Load products (node)</button>
<button onclick="fetch('http://127.0.0.1:7002/cart').then(r=>r.json()).then(j=>out.textContent=JSON.stringify(j))">Checkout (node)</button>
<button onclick="fetch('http://127.0.0.1:7001/order').then(r=>r.json()).then(j=>out.textContent=JSON.stringify(j))">Place order (python)</button>
<pre id="out" style="background:#f4f4f4;padding:10px;margin-top:20px"></pre>
</body>
</html>
