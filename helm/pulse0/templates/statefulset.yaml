apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pulse0.fullname" . }}
  labels: {{- include "pulse0.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "pulse0.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "pulse0.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "pulse0.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "pulse0.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pulse0
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4318
              protocol: TCP
          env:
            - name: PULSE0_HOST
              value: "0.0.0.0"
            - name: PULSE0_PORT
              value: "4318"
            - name: PULSE0_DB
              value: /data/pulse0.db
            {{- if not (has .Values.mode (list "selfhosted" "hosted")) }}
            {{- fail "mode must be 'selfhosted' or 'hosted'" }}
            {{- end }}
            - name: PULSE0_MODE
              value: {{ .Values.mode | quote }}
            {{- if eq .Values.mode "hosted" }}
            - name: PULSE0_DATA_DIR
              value: {{ .Values.hosted.dataDir | quote }}
            - name: PULSE0_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "hosted.adminTokenSecret (an existing Secret with the platform admin token) is required when mode=hosted" .Values.hosted.adminTokenSecret }}
                  key: {{ .Values.hosted.adminTokenKey }}
            {{- if .Values.hosted.allowAI }}
            - name: PULSE0_HOSTED_AI
              value: "1"
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.auth.token }}
            - name: PULSE0_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulse0.fullname" . }}-auth
                  key: token
            {{- end }}
            {{- if .Values.auth.ingestToken }}
            - name: PULSE0_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulse0.fullname" . }}-auth
                  key: ingestToken
            {{- end }}
            {{- if and .Values.auth.oidc.enabled (eq .Values.mode "selfhosted") }}
            {{- $o := .Values.auth.oidc }}
            - { name: PULSE0_OIDC_ISSUER, value: {{ required "auth.oidc.issuer is required when auth.oidc.enabled" $o.issuer | quote }} }
            - { name: PULSE0_OIDC_CLIENT_ID, value: {{ required "auth.oidc.clientId is required when auth.oidc.enabled" $o.clientId | quote }} }
            - name: PULSE0_OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ required "auth.oidc.existingSecret (with keys clientSecret and sessionSecret) is required when auth.oidc.enabled" $o.existingSecret }}, key: clientSecret } }
            - name: PULSE0_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: {{ $o.existingSecret }}, key: sessionSecret } }
            - { name: PULSE0_OIDC_SCOPES, value: {{ $o.scopes | quote }} }
            - { name: PULSE0_OIDC_ROLE_CLAIM, value: {{ $o.roleClaim | quote }} }
            - { name: PULSE0_OIDC_ADMIN_GROUPS, value: {{ join "," $o.adminGroups | quote }} }
            - { name: PULSE0_OIDC_EDITOR_GROUPS, value: {{ join "," $o.editorGroups | quote }} }
            - { name: PULSE0_OIDC_VIEWER_GROUPS, value: {{ join "," $o.viewerGroups | quote }} }
            - { name: PULSE0_OIDC_DEFAULT_ROLE, value: {{ $o.defaultRole | quote }} }
            - { name: PULSE0_OIDC_ALLOWED_DOMAINS, value: {{ join "," $o.allowedDomains | quote }} }
            - { name: PULSE0_OIDC_REDIRECT_URL, value: {{ $o.redirectUrl | quote }} }
            - { name: PULSE0_SESSION_TTL_HOURS, value: {{ $o.sessionTtlHours | quote }} }
            - { name: PULSE0_OIDC_PROVIDER_NAME, value: {{ $o.providerName | quote }} }
            {{- end }}
            {{- if .Values.postgres.enabled }}
            - name: PULSE0_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.existingSecret is required when postgres.enabled" .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.secretKey }}
            - name: PULSE0_PG_SCHEMA
              value: {{ .Values.postgres.schema | quote }}
            {{- end }}
            {{- if .Values.ai.enabled }}
            # Claude-backed 'Ask Pulse0'. optional:true so the pod still starts (in rule-based mode)
            # if the secret has not been created yet; restart the pod after creating it.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ai.existingSecret }}
                  key: {{ .Values.ai.secretKey }}
                  optional: true
            {{- with .Values.ai.model }}
            - name: PULSE0_AI_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.persistence.accessMode }}]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
  {{- end }}
