{{- if or .Values.auth.token .Values.auth.ingestToken -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulse0.fullname" . }}-auth
  labels: {{- include "pulse0.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.token }}
  token: {{ .Values.auth.token | quote }}
  {{- end }}
  {{- if .Values.auth.ingestToken }}
  ingestToken: {{ .Values.auth.ingestToken | quote }}
  {{- end }}
{{- end }}
