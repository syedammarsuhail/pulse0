name: Release (image + chart)

# Builds the Pulse0 image, scans it, signs it and pushes it to GHCR; packages the Helm chart
# and pushes it to GHCR as an OCI artifact.
#   push to master  -> ghcr.io/<owner>/pulse0:edge and :sha-<short>
#   tag vX.Y.Z      -> ghcr.io/<owner>/pulse0:X.Y.Z and :latest, chart version X.Y.Z
#   pull request    -> build + scan only, nothing is pushed
# No secrets to configure: it uses the built-in GITHUB_TOKEN.

on:
  # Publish only on a version tag or a manual run: publishing on every push to master released unscanned code.
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless cosign signing
      security-events: write   # upload scan results
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/pulse0
          tags: |
            type=edge,branch=master
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build a single-arch image first so it can be scanned before anything is pushed.
      - name: Build (amd64, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pulse0:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report CRITICAL+HIGH (visible in the run summary and the Security tab), never blocks.
      - name: Scan image, full report (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulse0:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Upload scan results to the Security tab
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true   # needs code scanning (free on public repos, GHAS on private)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      # Gate: fixable CRITICAL vulnerabilities stop the release before anything is pushed.
      - name: Scan image, gate on CRITICAL (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulse0:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push (amd64 + arm64)
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${REGISTRY}/${{ github.repository_owner }}/pulse0@${{ steps.build.outputs.digest }}"

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            APPVER="$VERSION"
          else
            VERSION="0.0.0-edge.${GITHUB_SHA::7}"
            APPVER="edge"
          fi
          helm lint helm/pulse0
          helm package helm/pulse0 --version "$VERSION" --app-version "$APPVER" -d dist
          helm push "dist/pulse0-${VERSION}.tgz" "oci://${REGISTRY}/${OWNER}/charts"
          echo "Chart: oci://${REGISTRY}/${OWNER}/charts/pulse0 version ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    runs-on: ubuntu-latest
    needs: [image, chart]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
