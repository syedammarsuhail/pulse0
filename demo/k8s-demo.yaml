apiVersion: v1
kind: Namespace
metadata: { name: demo }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: demo, labels: { app: backend } }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: pulse0-demo:local
          imagePullPolicy: IfNotPresent
          command: [opentelemetry-instrument]
          args: [uvicorn, backend:app, --host, 0.0.0.0, --port, "8001"]
          ports: [{ containerPort: 8001 }]
          env:
            - { name: OTEL_SERVICE_NAME, value: backend }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.version=2.4.1,deployment.environment=prod,team=platform" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://pulse0-collector.observability.svc.cluster.local:4319" }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: demo }
spec:
  selector: { app: backend }
  ports: [{ port: 8001, targetPort: 8001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: demo, labels: { app: frontend } }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: pulse0-demo:local
          imagePullPolicy: IfNotPresent
          command: [opentelemetry-instrument]
          args: [uvicorn, frontend:app, --host, 0.0.0.0, --port, "8000"]
          ports: [{ containerPort: 8000 }]
          env:
            - { name: OTEL_SERVICE_NAME, value: frontend }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.version=1.3.0,deployment.environment=prod,team=storefront" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://pulse0-collector.observability.svc.cluster.local:4319" }
            - { name: BACKEND_URL, value: "http://backend.demo.svc.cluster.local:8001" }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: demo }
spec:
  selector: { app: frontend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loadgen, namespace: demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: loadgen } }
  template:
    metadata: { labels: { app: loadgen } }
    spec:
      containers:
        - name: loadgen
          image: pulse0-demo:local
          imagePullPolicy: IfNotPresent
          command: [python, loadgen.py]
          env:
            - { name: FRONTEND_URL, value: "http://frontend.demo.svc.cluster.local:8000" }
            - { name: RPS, value: "6" }
